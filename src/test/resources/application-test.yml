spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;INIT=CREATE SCHEMA IF NOT EXISTS staff\;CREATE SCHEMA IF NOT EXISTS guest\;CREATE SCHEMA IF NOT EXISTS owner\;CREATE SCHEMA IF NOT EXISTS admin\;CREATE SCHEMA IF NOT EXISTS app_auth
