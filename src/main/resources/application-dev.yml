spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:b4codedb}
    username: ${DB_USER:b4code}
    password: ${DB_PASSWORD:b4codepass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  session:
    store-type: redis

  security:
    oauth2:
      resourceserver:
        jwt:
          # Define JWT Configuration here
          # Since it's symmetric JWT or asymmetric, we will configure an issuer or public key.
          # For development, we might use a secret key instead, via application properties.
          issuer-uri: ${JWT_ISSUER_URI:} 

b4code:
  security:
    jwt:
      secret: ${JWT_SECRET:8a846c483a992e5927515c0e1ae5b0c96c4d444458d92a0653d9e4c19a9a1d1d} # Ensure this is AES-256 equivalent
      expirationMs: 3600000
      refreshExpirationMs: 86400000

