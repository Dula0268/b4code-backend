spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:b4codedb}
    username: ${DB_USER:b4code}
    password: ${DB_PASSWORD:b4codepass}
    driver-class-name: org.postgresql.Driver

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  session:
    store-type: redis

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  security:
    oauth2:
      resourceserver:
        jwt:
          # Define JWT Configuration here
          # Since it's symmetric JWT or asymmetric, we will configure an issuer or public key.
          # For development, we might use a secret key instead, via application properties.
          issuer-uri: ${JWT_ISSUER_URI:} 

b4code:
  security:
    jwt:
      secret: ${JWT_SECRET}
      expirationMs: 3600000
      refreshExpirationMs: 86400000

payhere:
  merchant-id: 1235421
  merchant-secret: ${PAYHERE_SECRET}
  sandbox: true
  checkout-url: https://sandbox.payhere.lk/pay/checkout
  notify-url: http://localhost:8080/api/payments/notify
  return-url: http://localhost:3001/guest/booking/confirmation
  cancel-url: http://localhost:3001/payment

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}