spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=${DB_SSLMODE:require}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 20000
      validation-timeout: 5000
      maximum-pool-size: 3
      minimum-idle: 1
      idle-timeout: 30000
      keepalive-time: 60000

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  session:
    store-type: redis

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  security:
    oauth2:
      resourceserver:
        jwt:
          # Define JWT Configuration here
          # Since it's symmetric JWT or asymmetric, we will configure an issuer or public key.
          # For development, we might use a secret key instead, via application properties.
          issuer-uri: ${JWT_ISSUER_URI:} 

b4code:
  qr:
    base-url: http://localhost:3000
  security:
    jwt:
      secret: ${JWT_SECRET}
      expirationMs: 86400000
      refreshExpirationMs: 604800000

payhere:
  merchant-id: 1235421
  merchant-secret: ${PAYHERE_SECRET}
  sandbox: true
  checkout-url: https://sandbox.payhere.lk/pay/checkout
  notify-url: http://localhost:8080/api/payments/notify
  return-url: http://localhost:3000/guest/booking
  cancel-url: http://localhost:3000/payment

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}