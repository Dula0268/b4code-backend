spring:
  application:
    name: hospitality-platform

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  output:
    ansi:
      enabled: always

server:
  port: 8080
  # TLS 1.3 configuration would typically be enabled via SSL properties if terminating TLS at the application level
  # Usually, for containerized apps, TLS is terminated at the ingress controller (e.g., Kubernetes Ingress/Nginx).
  # We can prepare the properties for SSL if needed.
  ssl:
    enabled: false # Set to true when not terminating at proxy
    protocol: TLSv1.3
    ciphers: TLS_AES_128_GCM_SHA256,TLS_AES_256_GCM_SHA384,TLS_CHACHA20_POLY1305_SHA256

logging:
  level:
    root: INFO
    com.hospitality: DEBUG